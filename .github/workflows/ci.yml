name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: multi-agent-system-pattern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOLDEN_EVAL_REGISTRY_PATH: ${{ github.workspace }}/golden-eval-registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - run: pip install -e golden-eval-registry

      - name: Unit tests, including golden-eval reviewer-gate merge gate
        run: pytest -q -v

      - name: Reviewer-gate benchmark (real, executed run — printed for the log)
        run: python scripts/benchmark_reviewer_gate.py

  ci-ok:
    name: CI gate
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = "success"
